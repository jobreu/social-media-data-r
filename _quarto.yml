project:
  type: book
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"
    
book:
  title: "Collecting and Analyzing Social Media Data with R"
  author: "Johannes Breuer"
  date: "05-21-2026"
  sidebar:                       
    logo: images/logo.png
  chapters:
    - index.qmd
    - part: "Introduction"
      chapters:
      - 01-intro-to-r.qmd
    - part: "Data Wrangling"
      chapters:
      - 03-import-export.qmd
      - 04-text-data.qmd
    - part: "End"
      chapters:
      - summary.qmd
      - references.qmd

# Citations configuration
bibliography: references.bib

# Output formats and styling
format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt