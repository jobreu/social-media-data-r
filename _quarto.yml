project:
  type: book
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"

lang: de
    
book:
  title: "Sammlung und Analyse von Social-Media-Daten mit R"
  author: "Johannes Breuer"
  date: "06-09-2026"
  repo-url: "https://github.com/jobreu/social-media-data-r"
  repo-actions: [edit, issue]
  page-footer:
    left: "Materials created by Johannes Breuer"
    right: "This work is licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)."
  sidebar:                       
    logo: images/logo.png
  chapters:
    - index.qmd
    - part: "Grundlagen"
      chapters:
      - 01-installation.qmd
      - 02-rstudio.qmd
      - 03-objects.qmd
      - 04-functions.qmd
      - 05-packages.qmd
      - 06-import-export.qmd
    - part: "Data Wrangling"
      chapters:
      - 07-tidyverse.qmd
      - 08-wrangling-df.qmd
      - 09-wrangling-variables.qmd
    - part: "Daten sammeln"
      chapters:
      - 10-collection-methods.qmd
      - 11-bluesky-collection.qmd
      - 12-tiktok-collection.qmd
      - 13-youtube-collection.qmd
    - part: "Datenanalyse"
      chapters:
      - 14-analysis-methods.qmd
      - 15-preprocessing.qmd
      - 16-descriptive-analysis.qmd
      - 17-sent-dict.qmd
      - 18-topicmodels.qmd
    - part: "Tipps & Tricks"
      chapters:
      - 19-errors.qmd
      - 20-message-warning-error.qmd
      - 21-help.qmd
      - 22-function-lifecycle.qmd
      - 23-comments.qmd
      - 24-names.qmd
      - 25-codebooks.qmd
      - 26-paths.qmd
      - 27-projects.qmd
    - references.qmd

crossref:
  sec-prefix: "Kapitel"
  fig-prefix: "Abbildung"
  tbl-prefix: "Tabelle"

# Citations configuration
bibliography: references.bib
csl: apa.csl

# Output formats and styling
format:
  html:
    theme:
      - cosmo
      - brand
    link-external-newwindow: true
    link-external-icon: true
  pdf:
    documentclass: scrreprt