project:
  type: book
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"

engine: knitr

lang: de
    
book:
  title: "Sammlung und Analyse von Social-Media-Daten mit R"
  author: "Johannes Breuer"
  date: "05-21-2026"
  sidebar:                       
    logo: images/logo.png
  chapters:
    - index.qmd
    - part: "Grundlagen"
      chapters:
      - 01-installation.qmd
      - 02-rstudio.qmd
      - 03-objects.qmd
      - 04-functions.qmd
      - packages.qmd
      - 05-import-export.qmd
    - part: "Data Wrangling"
      chapters:
      - tidyverse.qmd
      - 06-wrangling-df.qmd
      - 07-wrangling-variables.qmd
      - 08-text-data.qmd
    - part: "Tipps & Tricks"
      chapters:
      - 16-errors.qmd
      - 15-message-warning-error.qmd
      - 14-help.qmd
      - 18-function-lifecycle.qmd
      - 13-comments.qmd
      - names.qmd
      - codebooks.qmd
      - 17-paths.qmd
      - projects.qmd
    - references.qmd

crossref:
  sec-prefix: "Kapitel"
  fig-prefix: "Abbildung"
  tbl-prefix: "Tabelle"

# Citations configuration
bibliography: references.bib
csl: apa.csl

# Output formats and styling
format:
  html:
    theme:
      - cosmo
      - brand
    link-external-newwindow: true
    link-external-icon: true
  pdf:
    documentclass: scrreprt